# Local Postgres for tests and development (production uses Neon).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auratrade
      POSTGRES_PASSWORD: auratrade
      POSTGRES_DB: auratrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auratrade -d auratrade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
