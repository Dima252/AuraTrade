name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as docker-compose.yml; the tests create and drop their own databases.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auratrade
          POSTGRES_PASSWORD: auratrade
          POSTGRES_DB: auratrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auratrade -d auratrade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://auratrade:auratrade@localhost:5432/auratrade
          # Fail instead of skipping the database tests if Postgres isn't reachable.
          AURATRADE_REQUIRE_DB: "1"
        run: uv run pytest --cov --cov-report=term --cov-fail-under=95

      - name: Guardrails coverage (100% branch, README §8)
        run: uv run coverage report --include="*/auratrade/guardrails/*" --fail-under=100

      - name: Portfolio pure layer coverage (100% branch, task 3.19)
        run: uv run coverage report --include="*/auratrade/strategies/core_allocation.py,*/auratrade/tax/*,*/auratrade/calendar/rebalance.py" --fail-under=100
