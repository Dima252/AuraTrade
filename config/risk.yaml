# Every trading threshold lives here (CLAUDE.md §6), loaded into `auratrade.config.RiskConfig`.
# Unknown keys are rejected. The hash of the validated values is logged with every job run,
# so a change here is visible in every log line that follows it.
#
# Fractions are of equity (0.01 = 1%). Windows count sessions, never calendar days.
# Sections for the scans and entry rules are added with the tasks that implement them
# (3.2a, 3.5b); the exit-plan menus and the earnings cushion are under `plans`.

regimes:  # README §6
  CONFIRMED_UPTREND:
    strategies:
      - {strategy: VCP_BREAKOUT}
      - {strategy: MOMENTUM_BREAKOUT}
      - {strategy: EPISODIC_PIVOT}
      - {strategy: LEADER_PULLBACK}
    base_risk: 0.01
    max_exposure: 1.0
    max_positions: 6
    max_positions_large_account: 8
  UNDER_PRESSURE:
    strategies:
      - {strategy: LEADER_PULLBACK, min_conviction: 4}
      - {strategy: VCP_BREAKOUT, min_conviction: 4}
      - {strategy: EPISODIC_PIVOT, min_conviction: 4}
    base_risk: 0.005
    max_exposure: 0.5
    max_positions: 4
  EARLY_UPTREND:  # starter limits; see early_uptrend_step
    strategies:
      - {strategy: EMERGING_LEADER}
      - {strategy: EPISODIC_PIVOT}
    base_risk: 0.0025
    max_exposure: 0.25
    max_positions: 3
  CORRECTION:  # cash: existing positions only
    strategies: []
    base_risk: 0.0
    max_exposure: 0.0
    max_positions: 0
  early_uptrend_step:  # never applies to a `no_ftd` entry
    starter_sessions: 10
    min_score_to_step_up: 1
    stepped_base_risk: 0.005
    stepped_max_exposure: 0.5
  large_account_equity: 100000

guardrails:  # README §8
  max_risk_per_trade: 0.015          # hard cap on effective risk
  max_position_size: 0.25
  max_heat: 0.06
  heat_min_room_of_planned: 0.5      # clip to the room left; reject below half the planned risk
  max_per_cluster: 2
  cluster_correlation: 0.7
  cluster_correlation_sessions: 60
  pivot_tolerance: 0.03              # LLM pivot within ±3% of the code pivot
  min_stop_below_pivot_atr: 0.5
  max_chase_above_pivot: 0.05
  max_above_50d: 0.25                # momentum and EPs exempt
  late_stage_base_count: 3           # risk × late_stage_risk_factor
  late_stage_risk_factor: 0.5
  max_base_count: 3                  # a 4th-stage base or later is not fundable
  earnings_blackout_sessions: 5
  earnings_estimate_sessions: 63     # unknown next date: last report + 63 sessions
  earnings_estimate_window_sessions: 10
  tranche2_max_sessions: 3

halts:  # README §8, §5.13
  daily_loss: 0.02
  weekly_loss: 0.05
  drawdown: 0.15

multiplier:  # README §8, progressive exposure
  win_r: 0.5
  loss_r: 0.5
  deep_drawdown: 0.10
  deep_drawdown_multiplier: 0.25
  drawdown: 0.05
  drawdown_multiplier: 0.5
  tier_exit_wins: 3
  losing_streak: 3
  losing_streak_exit_wins: 2
  losing_streak_multiplier: 0.5
  prove_it_wins: 2
  prove_it_multiplier: 0.5
  unproven_regime_trades: 5
  unproven_regime_multiplier: 0.5
  trading_well_high_sessions: 5
  trading_well_trades: 10
  trading_well_multiplier: 1.25

climax:  # README §7.3 "Climax sale"
  up_day_clusters:                   # >= 7 up days in 8, or >= 8 in 10
    - {up_days: 7, of_sessions: 8}
    - {up_days: 8, of_sessions: 10}
  min_above_long_average: 0.70       # >= 70% above the 200-day
  fast_gain_min: 0.25                # >= 25% gain ...
  fast_gain_window: 15               # ... in <= 15 sessions ...
  # ... "after an extended run": only once the move is this many sessions old. Provisional:
  # the first 15 sessions after the breakout are the 8-week-hold window (+20% in 15), where
  # a fast gain is a strength signal, not a climax. Tuned only on backtest evidence (3.8).
  fast_gain_min_move_sessions: 15
  # Open above the prior session's high by at least this much (user decision, task 3.5a).
  exhaustion_min_gap: 0.01
  sell_half_signals: 2
  sell_all_signals: 3

data:  # README §4
  min_coverage: 0.90
  macro_stale_sessions: 2

universe:  # README §5.1; point in time, on raw prices as traded that day
  exchanges: [NYSE, NASDAQ, AMEX]
  security_types: [COMMON, ADR]    # ADRs included (#111)
  min_price: 10.0
  min_dollar_volume: 10000000
  dollar_volume_sessions: 50
  min_history_sessions: 252

ingest:  # README §5.1, §10; see auratrade.ingest
  bar_history_sessions: 504          # 2 years in Postgres; full history in Parquet
  track_margin: 0.5                  # bars kept for tickers passing half the universe filters
  max_delistings: 50                 # more vanishing in one evening = a vendor glitch: fail
  split_close_tolerance: 0.02        # re-fetched overlap bar moved > 2%: re-fetch the window
  outliers:                          # NVDA high 195.95 on 2024-06-10 (true ~122), #126
    min_beyond_body: 0.15            # floors; a volatile stock's limit is its range x multiple
    min_beyond_neighbours: 0.15
    adr_multiple: 3.0
    adr_sessions: 20
  corporate_actions_lookback_sessions: 5
  corporate_actions_lookahead_sessions: 5
  macro:
    quote_settle_minutes: 15         # CBOE JSON final once last_trade_time >= close + 15 min
    history_mismatch_tolerance: 0.01
    fred_lookback_sessions: 10
  earnings_horizon_sessions: 63      # Finnhub calendar, day by day
  earnings_usual_timing_reports: 8   # blank timing -> the company's usual over its last 8 (#119)
  earnings_recent_sessions: 3        # surprise, EDGAR 8-K event, fundamentals after a report
  earnings_surprise_max_requests: 150
  fundamentals_max_requests: 200
  fundamentals_refresh_sessions: 20  # each tracked ticker's EDGAR facts at least every 20
  fundamentals_quarters: 12
  industries_refresh_sessions: 5     # each universe ticker's SIC weekly
  industry_min_group_size: 15        # spike 0.3e: 102 groups
  archive_after_sessions: 63         # ~90 days
  http_workers: 4                    # concurrent requests per vendor, under its rate limit
  transaction_idle_minutes: 30       # a step's transaction waits on vendor calls; Neon allows 5
  db_size_limit_mb: 512              # Neon free tier
  db_size_alert_fraction: 0.70

history:  # README §5.1, §10; the Parquet history and its backfill (scripts/backfill.py)
  start: 2016-01-04                  # the first session; Alpaca SIP daily bars begin here
  max_gap_sessions: 30               # a longer gap in trading = a new security (ticker reuse)
  max_jump: 4.0                      # so is a 4x (or 1/4x) one-day close move: reorganizations
  duplicate_share: 0.9               # bars identical on 90% of sessions = one company, two tickers
  enumeration_every_sessions: 126    # 1-4 letter ticker sweep spacing (< min_history_sessions)
  enumeration_window_sessions: 5     # sessions per sweep (~3 minutes each, spike 0.3a)
  bar_chunk_symbols: 50
  workers: 8                         # concurrent requests, under Alpaca's 200 a minute

jobs:  # README §2
  chain_wait_minutes: 30
  duration_alert_minutes: 10
  stale_running_minutes: 20
  watchdog_grace_minutes: 15
  eod_review_window_minutes: 30

trend_template:  # README §5.3 (Minervini)
  short_sma: 50
  mid_sma: 150
  long_sma: 200
  long_sma_rising_sessions: 22       # rule 3: the 200 SMA above its value 22 sessions ago
  range_sessions: 252                # the 52-week high and low
  min_above_low: 0.30                # rule 6: >= 30% above the 52-week low
  max_below_high: 0.25               # rule 7: within 25% of the 52-week high
  min_rs_rating: 70                  # rule 8
  rs_weights:                        # RS score = 0.4*R63 + 0.2*R126 + 0.2*R189 + 0.2*R252
    - {lookback: 63, weight: 0.4}
    - {lookback: 126, weight: 0.2}
    - {lookback: 189, weight: 0.2}
    - {lookback: 252, weight: 0.2}
  required_rules:                    # rule numbers each strategy needs; EPs are exempt
    VCP_BREAKOUT: [1, 2, 3, 4, 5, 6, 7, 8]
    MOMENTUM_BREAKOUT: [1, 2, 3, 4, 5, 6, 7, 8]
    LEADER_PULLBACK: [1, 2, 3, 4, 5, 6, 7, 8]
    EMERGING_LEADER: [1, 5, 6, 7, 8]   # the MA stack (2-4) lags right after a correction
    EPISODIC_PIVOT: []

bases:  # README §5.3 base count (IBD); see indicators/bases.py
  min_sessions: 25                   # IBD's 5-week minimum; shorter consolidations are ignored
  max_depth: 0.50                    # deeper is not a base, and resets the count
  swing_reversal: 0.03               # a contraction is a >= 3% pullback from a swing high
  pivot_min_position: 0.5            # the final contraction's high is the pivot only in the upper half
  new_stage_advance: 0.20            # a new stage needs >= 20% from the prior base's pivot

regime:  # README §5.2; provisional 4-pillar thresholds from the 2.4 backtest (#135), final after the 3.8 re-run
  indexes: [SPY, QQQ]                # both for +1, either for -1; distribution counted per index
  index_trend:
    short_sma: 50
    long_sma: 200
    slope_sessions: 10               # "50 SMA rising / falling": vs its value 10 sessions ago
  breadth:
    sma: 50
    up_min_above: 0.60               # +1: > 60% above the 50 SMA and net new highs > 0
    down_max_above: 0.35             # -1: < 35% above, or net new highs < 0
    new_high_sessions: 252           # 52-week highs and lows
    net_new_highs_sessions: 10       # averaged over 10 sessions
  volatility:
    up_max_vix: 20                   # +1: VIX < 20 and VIX/VIX3M < 0.9
    up_max_ratio: 0.9
    down_min_ratio: 1.0              # -1: VIX/VIX3M > 1.0 or VIX > 30
    down_min_vix: 30
  distribution:
    min_decline: 0.002               # down >= 0.2% on volume above the prior session's
    window_sessions: 25
    up_max_days: 3                   # +1: <= 3 (higher index count)
    down_min_days: 8                 # -1: >= 8 (IBD: 6; ETF volume overcounts, 2.4 / #135)
    exclude_expiration_sessions: false   # flagged either way; the 2.4 backtest compares
  leadership:
    result_sessions: 5               # a breakout's result is complete 5 sessions after it
    window_sessions: 20              # breakouts from T-24 to T-5
    min_breakouts: 10                # fewer scores 0
    up_min_share: 0.55
    down_max_share: 0.35
  follow_through:
    min_gain: 0.0125
    first_day: 4
    last_strong_day: 7               # later FTDs are flagged weaker
  transitions:
    confirmed_min_score: 2           # >= +2 CONFIRMED_UPTREND (4 pillars until 3.8; #135)
    correction_max_score: -2         # <= -2 CORRECTION from CU / UP ...
    correction_sessions: 1           # ... after this many sessions in a row (1: immediate);
                                     # the index-trend pillar at -1 is always immediate
    debounce_score: 1                # CU -> UP at +1 only after debounce_sessions in a row
    debounce_sessions: 2
    upgrade_sessions: 3              # UP / EU -> CU after 3 sessions >= confirmed_min_score in the state
    early_uptrend_min_sessions: 10   # labels in EARLY_UPTREND before CONFIRMED_UPTREND
    no_ftd_sessions: 10              # CORRECTION -> EARLY_UPTREND (no_ftd) after 10 sessions >= +2
    no_ftd_min_score: 2
    early_uptrend_max_distribution: 6    # since entering EARLY_UPTREND, higher index count (kept at 6, #135)
  crisis:  # no new entries (README §5.2)
    vix_ratio_above: 1.0             # VIX/VIX3M > 1.0 ...
    vix_ratio_sessions: 2            # ... for >= 2 sessions
    index: SPY
    index_drop: 0.04                 # SPY -4% in a session: that session and the next
  replay_warmup_sessions: 252        # a replay starts this many sessions before its first label

plans:  # README §7.1-7.4; see auratrade.plans. Defaults change only on backtest evidence (3.8).
  trails:                            # "first close below" the average exits (§7.3)
    TEN_DAY: {kind: SMA, window: 10}   # user decision, task 3.5a: the 10-day is an SMA
    EMA_21: {kind: EMA, window: 21}
    SMA_50: {kind: SMA, window: 50}
  # Bounded menus (§7.3 "Strength partial"): a plan picks values inside these ranges.
  # 0.3333333333 is ⅓ (share counts are floored with a small tolerance).
  partial_menus:
    KULLAMAGI:                       # (a) sell ⅓-½ after 3-5 sessions if >= +1.5R
      fraction: {min: 0.3333333333, max: 0.5}
      after_sessions: {min: 3, max: 5}
      min_r: 1.5
    ONEIL:                           # (b) sell ¼-½ at +20-25%
      fraction: {min: 0.25, max: 0.5}
      gain: {min: 0.20, max: 0.25}
    MINERVINI:                       # (c) sell ⅓-½ at +2-3R
      fraction: {min: 0.3333333333, max: 0.5}
      r_multiple: {min: 2.0, max: 3.0}
  breakeven_at_r: 3.0                # stop -> breakeven at +3R (session high)
  round_trip_gain: 0.10              # once +10% is reached (session high), stop >= breakeven
  eight_week_hold:
    min_gain: 0.20                   # +20% (decision price) ...
    within_sessions: 15              # ... within 15 sessions of the breakout (entry = session 1)
    hold_sessions: 40                # hold on the 50-day through session 40
  heavy_volume_reversal:
    min_volume_ratio: 1.5            # projected volume vs the 50-day average
  early_sessions: 20                 # §7.2 rules apply in the first 20 sessions
  time_stop:
    min_r: 1.0                       # "no progress" = session high since entry < +1R
    halve_session: 10
    halve_fraction: 0.5
    exit_session: 20
  climax_sell_fraction: 0.5          # >= climax.sell_half_signals -> sell ½ (once)
  late_stage_sale:
    min_base_count: 4                # a breakout from a 4th-stage base or later ...
    sell_fraction: 0.5               # ... sells ½ into strength (once)
  earnings_cushion:                  # §7.4, unrealized gain in R on the decision price
    exit_below_r: 1.0
    hold_full_from_r: 3.0
    trim_fraction: 0.5
  confirmation_gates:                # §7.1, tranche 2 on the decision price
    BREAKOUT:                        # VCP, emerging leaders
      max_above_level: 0.05
      min_range_position: 0.5        # upper half of the day's range
      min_volume_ratio: 1.4          # projected volume vs the 50-day average
      rs_line_near_high: true
      above_tested_ma: false
      rs_line_not_at_low: false
    PULLBACK:                        # leader pullbacks
      max_above_level: 0.05
      min_range_position: 0.5
      min_volume_ratio: 1.0
      rs_line_near_high: false
      above_tested_ma: true
      rs_line_not_at_low: true
  entry:                             # §7.1
    VCP_BREAKOUT: {trigger: PIVOT, stop: STRUCTURAL, tranches: 2, gate: BREAKOUT}
    LEADER_PULLBACK: {trigger: PIVOT, stop: STRUCTURAL, tranches: 2, gate: PULLBACK}
    EMERGING_LEADER: {trigger: PIVOT, stop: STRUCTURAL, tranches: 2, gate: BREAKOUT}
    MOMENTUM_BREAKOUT: {trigger: CONSOLIDATION_OR_RANGE_HIGH, stop: LOW_OF_DAY, tranches: 1}
    EPISODIC_PIVOT: {trigger: OPENING_RANGE_HIGH, stop: LOW_OF_DAY, tranches: 1}
  # Default exit sets (§7.3): one trader's own set per strategy, plus the safety rules
  # (earnings cushion, regime-downgrade tightening). Values inside the menus are provisional
  # and chosen by the 3.8 baseline backtest.
  exit_sets:
    KULLAMAGI:
      partial: {kind: KULLAMAGI, fraction: 0.3333333333, after_sessions: 3}
      breakeven_after_partial: true
      trail: TEN_DAY
    MINERVINI:
      partial: {kind: MINERVINI, fraction: 0.3333333333, r_multiple: 2.0}
      breakeven_after_partial: true
      breakeven_at_r: true
      trail: SMA_50
    ONEIL:
      partial: {kind: ONEIL, fraction: 0.25, gain: 0.20}
      round_trip: true
      trail: SMA_50
      eight_week_hold: true
      climax_sales: true
      heavy_volume_reversal: true
      late_stage_sale: true
  # Each strategy's default plan: its set, plus per-rule switches (`overrides`) so the
  # baseline backtest can add rules one at a time.
  default_plans:
    MOMENTUM_BREAKOUT: {exit_set: KULLAMAGI}
    EPISODIC_PIVOT: {exit_set: KULLAMAGI}
    VCP_BREAKOUT: {exit_set: MINERVINI}
    LEADER_PULLBACK: {exit_set: MINERVINI}
    EMERGING_LEADER: {exit_set: ONEIL}

execution:  # README §5.7; see auratrade.execution
  decision_price:                    # #120
    trade_max_age_seconds: 120       # the last IEX trade if <= 2 minutes old ...
    quote_max_age_seconds: 60        # ... else the quote midpoint if <= 1 minute old ...
    max_spread: 0.02                 # ... with a spread <= 2% of the midpoint (provisional)
  marketable_limit_slippage: 0.005   # a marketable sell limit 0.5% below the decision price
  sell_wait_seconds: 30              # README §5.7.2: re-price once after ~30 s, then market
  market_order_wait_seconds: 30
  fill_poll_seconds: 2
  call_attempts: 3                   # an unanswered order call is retried with the same id
  lock_wait_alert_seconds: 120       # README §5.7.7: a job waiting > 2 minutes alerts
  lock_wait_max_seconds: 480         # then fails (Lambda retries it), inside Lambda's 15 min
  lock_idle_timeout_minutes: 10      # backstop for a frozen holder; longer than any order section

skeleton:  # execution plan task 1.7: rule-only, no LLM; Phase 5 replaces the scan and the pick
  trend_template_rules: [1, 2, 3, 4, 5, 8]
  pivot_sessions: 20                 # pivot = the 20-session high
  stop_sessions: 10                  # structural stop = the 10-session low ...
  max_stop: 0.08                     # ... at most 8% below the limit price
  limit_max_above_trigger: 0.02      # limit = trigger x (1 + min(2%, ½ ADR)), README §7.1
  limit_adr_fraction: 0.5
  adr_sessions: 20
  risk_per_trade: 0.0025             # fixed 0.25% of equity, sized on the worst fill
  picks: 3                           # top 3 by RS that size to at least one share
  candidates: 10                     # ranked signals written per evening
  max_positions: 6
  trail: EMA_21                      # the one soft rule: a decision price below the 21 EMA

strategies:  # README §5.3 scans (task 3.2a); see auratrade.strategies. Provisional until 3.8.
  VCP_BREAKOUT:                      # Minervini
    min_base_sessions: 15            # a base of 3 ...
    max_base_sessions: 325           # ... to 65 weeks
    min_depth: 0.05                  # the first (deepest) contraction: >= 5% (#136: not a merger-arbitrage flatline) ...
    max_depth: 0.35                  # ... and <= 35%
    min_contractions: 2              # 2-4, up to 6, each shallower than the last
    max_contractions: 6
    max_final_depth: 0.10            # the final contraction is tight
    swing_confirm_sessions: 3        # a contraction's high needs 3 sessions after it
    pivot_min_position: 0.5          # the final contraction sits in the upper half of the base
    volume_sessions: 50
    max_final_volume_ratio: 1.0      # volume dries up: the final contraction below the 50-day average
  MOMENTUM_BREAKOUT:                 # Kullamägi
    rank_lookbacks: [21, 63, 126]    # 1-, 3- and 6-month returns ...
    min_rank: 98                     # ... top ~2% of the universe on any of them
    move_sessions: 63                # the prior move, within the last 1-3 months ...
    min_move: 0.30                   # ... of at least 30% (low to the consolidation's high)
    min_consolidation_sessions: 10
    max_consolidation_sessions: 40
    ride_smas: [10, 20]              # riding the rising 10- or 20-day ...
    ma_rising_sessions: 5            # ... "rising": above its value 5 sessions ago
    adr_sessions: 20
  EPISODIC_PIVOT:                    # Kullamägi; the backtest proxy (no earnings beat: no free history)
    min_gap: 0.10                    # open >= 10% above the prior close ...
    min_volume_ratio: 3.0            # ... on >= 3x the average volume ...
    volume_sessions: 50              # ... of the prior 50 sessions
    rally_lookbacks: [63, 126]       # the prior 3- and 6-month moves, reported (a preference, not a filter)
    adr_sessions: 20                 # the pre-gap ADR
  LEADER_PULLBACK:                   # Minervini / O'Neil: buying a leader's pullback to its 10/21 EMA
    min_rs_rating: 80
    emas: [10, 21]                   # the averages it may test, shortest first
    atr_sessions: 14
    max_atr_from_ema: 1.0            # the session's low within 1 x ATR of the average
    swing_sessions: 10               # the pullback runs from the highest high of the last 10 sessions ...
    min_pullback_sessions: 2         # ... and has lasted at least 2 ...
    min_depth_atr: 2.0               # ... falling >= 2 x ATR to its low (#137: a real pullback, not a dip)
    volume_sessions: 50
    max_volume_ratio: 1.0            # on declining volume: the pullback below the 50-day average
  EMERGING_LEADER:                   # O'Neil: the first leaders out of a correction
    min_rs_rating: 85
    high_sessions: 252               # a new 52-week high, or the RS line at one
    lead_sessions: 21                # the drawdown counts from a month before the correction ...
    max_drawdown_vs_index: 1.5       # ... and is at most 1.5x SPY's over the same window
    max_sessions_since_correction: 63  # only within 3 months of the correction's end
    stop_sessions: 5                 # structural stop = the 5-session low (#137: the 10-session low was > 8% on 69%)

ranking:  # README §5.3 "Ranking and cap", "Verdict cache"; see auratrade.strategies.ranking (task 3.3)
  # The quality score is the plain average of 8 components, each scaled to 0-1 (#138, the user's
  # choice: no weights to fit). Only setups fundable in the regime compete; one slot per ticker.
  rs_line:                           # close / SPY
    high_window: 252                 # "at a new high": the highest of 52 weeks ...
    near_tolerance: 0.05             # ... "near" it: within 5%
    low_window: 50                   # "at a low": the lowest of 50 sessions (the pullback gate's)
  up_down_sessions: 50               # up/down volume ratio >= 1.0 = accumulation
  adr_sessions: 20                   # tightness = stop width / ADR, ranked within the session's pool
  extension_sma: 50                  # > guardrails.max_above_50d above it: excluded (momentum, EP exempt)
  catalyst:                          # without the surprise (no history)
    gap_lookback_sessions: 63        # an earnings gap-up within the last quarter ...
    min_gap: 0.05                    # ... opening >= 5% above the prior close ...
    min_volume_ratio: 1.5            # ... on >= 1.5x the prior 50-session volume
    volume_sessions: 50
    min_eps_growth: 0.25             # O'Neil's C: quarterly EPS up >= 25% year on year
  missing_component: 0.5             # a component without data scores neutral
  verdict_max_age_sessions: 3        # re-review a verdict older than 3 sessions
