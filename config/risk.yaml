# Every trading threshold lives here (CLAUDE.md §6), loaded into `auratrade.config.RiskConfig`.
# The portfolio manager's values are under `portfolio:` (README §5.4, §6-§8).
# Unknown keys are rejected. The hash of the validated values is logged with every job run,
# so a change here is visible in every log line that follows it.
#
# Fractions are of equity (0.01 = 1%). Windows count sessions, never calendar days.

data:  # README §4
  macro_stale_sessions: 2

ingest:  # README §5.1, §10; see auratrade.ingest
  bar_history_sessions: 504          # 2 years of the ETF list in Postgres; older bars in Parquet
  split_close_tolerance: 0.02        # re-fetched overlap bar moved > 2%: re-fetch the window
  outliers:                          # NVDA high 195.95 on 2024-06-10 (true ~122), #25
    min_beyond_body: 0.15            # floors; a volatile fund's limit is its range x multiple
    min_beyond_neighbours: 0.15
    adr_multiple: 3.0
    adr_sessions: 20
  corporate_actions_lookback_sessions: 5
  corporate_actions_lookahead_sessions: 5
  macro:
    quote_settle_minutes: 15         # CBOE JSON final once last_trade_time >= close + 15 min
    history_mismatch_tolerance: 0.01
    fred_lookback_sessions: 10
  http_workers: 4                    # concurrent requests per vendor, under its rate limit
  transaction_idle_minutes: 30       # a step's transaction waits on vendor calls; Neon allows 5
  db_size_limit_mb: 512              # Neon free tier
  db_size_alert_fraction: 0.70

history:  # README §5.1; the backtest's history backfill (scripts/backfill.py longhistory)
  start: 2016-01-04                  # the first session; Alpaca SIP daily bars begin here
  workers: 8                         # concurrent requests, under Alpaca's 200 a minute

jobs:  # README §2
  chain_wait_minutes: 30
  duration_alert_minutes: 10
  stale_running_minutes: 20
  watchdog_grace_minutes: 15

regime:  # README §5.2; a fact for the LLM, no rule reads it (#27)
  indexes: [SPY, QQQ]                # both for +1, either for -1; distribution counted per index
  index_trend:
    short_sma: 50
    long_sma: 200
    slope_sessions: 10               # "50 SMA rising / falling": vs its value 10 sessions ago
  volatility:
    up_max_vix: 20                   # +1: VIX < 20 and VIX/VIX3M < 0.9
    up_max_ratio: 0.9
    down_min_ratio: 1.0              # -1: VIX/VIX3M > 1.0 or VIX > 30
    down_min_vix: 30
  distribution:
    min_decline: 0.002               # down >= 0.2% on volume above the prior session's
    window_sessions: 25
    up_max_days: 3                   # +1: <= 3 (higher index count)
    down_min_days: 8                 # -1: >= 8 (IBD uses 6; ETF volume overcounts, #27)
    exclude_expiration_sessions: false   # expiration sessions are flagged either way
  follow_through:
    min_gain: 0.0125
    first_day: 4
    last_strong_day: 7               # later FTDs are flagged weaker
  transitions:
    confirmed_min_score: 2           # >= +2 CONFIRMED_UPTREND (#27)
    correction_max_score: -2         # <= -2 CORRECTION from CU / UP ...
    correction_sessions: 1           # ... after this many sessions in a row (1: immediate);
                                     # the index-trend pillar at -1 is always immediate
    debounce_score: 1                # CU -> UP at +1 only after debounce_sessions in a row
    debounce_sessions: 2
    upgrade_sessions: 3              # UP / EU -> CU after 3 sessions >= confirmed_min_score in the state
    early_uptrend_min_sessions: 10   # labels in EARLY_UPTREND before CONFIRMED_UPTREND
    no_ftd_sessions: 10              # CORRECTION -> EARLY_UPTREND (no_ftd) after 10 sessions >= +2
    no_ftd_min_score: 2
    early_uptrend_max_distribution: 6    # since entering EARLY_UPTREND, higher index count (kept at 6, #27)
  crisis:  # the crisis override in the regime the Portfolio Manager sees (README §5.2)
    vix_ratio_above: 1.0             # VIX/VIX3M > 1.0 ...
    vix_ratio_sessions: 2            # ... for >= 2 sessions
    index: SPY
    index_drop: 0.04                 # SPY -4% in a session: that session and the next
  replay_warmup_sessions: 252        # a replay starts this many sessions before its first label

execution:  # README §5.6; see auratrade.execution
  decision_price:                    # #23
    trade_max_age_seconds: 120       # the last IEX trade if <= 2 minutes old ...
    quote_max_age_seconds: 60        # ... else the quote midpoint if <= 1 minute old ...
    max_spread: 0.02                 # ... with a spread <= 2% of the midpoint (provisional)
  marketable_limit_slippage: 0.005   # a marketable sell limit 0.5% below the decision price
  sell_wait_seconds: 30              # README §5.6.2: re-price once after ~30 s, then market
  market_order_wait_seconds: 30
  buy_wait_seconds: 30               # a rebalance's buy works this long; the rest is cancelled
  fill_poll_seconds: 2
  call_attempts: 3                   # an unanswered order call is retried with the same id
  lock_wait_alert_seconds: 120       # README §5.6.5: a job waiting > 2 minutes alerts
  lock_wait_max_seconds: 480         # then fails (Lambda retries it), inside Lambda's 15 min
  lock_idle_timeout_minutes: 10      # backstop for a frozen holder; longer than any order section

charts:  # README §5.4: the Portfolio Manager's get_chart; see auratrade.charts. Image tokens ~ width x height / 750.
  daily_sessions: 252                # 1 year
  daily_width: 800
  daily_height: 600
  daily_averages:                    # the 10/21/50/150/200 of the README
    10-day SMA: {kind: SMA, window: 10}
    21-day EMA: {kind: EMA, window: 21}
    50-day SMA: {kind: SMA, window: 50}
    150-day SMA: {kind: SMA, window: 150}
    200-day SMA: {kind: SMA, window: 200}
  dpi: 100

portfolio:  # README §5.4, §6-§8; the backtest's rules: docs/backtests/portfolio-preregistration.md
  satellite_share: 0.20              # the LLM's part of equity; the core is the rest
  sma_months: 10                     # the trend: month-end total-return values against their 10-month SMA
  buffer: 0.02                       # DOWN below SMA x 0.98, UP above SMA x 1.02; between them the state stays
  up_level: 1.3                      # S&P exposure while UP ...
  down_level: 0.5                    # ... and while DOWN (the rest in T-bills)
  capped_level: 1.0                  # the most while the volatility cap or the halt is on
  min_level: 0.3                     # the LLM's shift can't take the core below this ...
  max_level: 1.5                     # ... or above this
  max_shift: 0.2                     # the LLM's shift of the rule level, either way (downward only when DOWN, capped or halted)
  vol_sessions: 21                   # realized volatility of SPY's daily returns through R ...
  vol_cap: 0.25                      # ... annualized (x sqrt(252)) above this caps the level
  drawdown_halt: 0.25                # equity <= 75% of its peak: no leverage, at once
  stop_fraction: 0.30                # the leveraged fund's GTC stop 30% below its last rebalance price; raised only
  drift_band: 0.05                   # trade a holding only if its target changed or it is 5 points off it
  max_etf_weight: 0.10               # each satellite ETF, of equity; the market fund (the satellite's neutral, #4) may fill it
  satellite_min_change: 0.02         # a satellite weight within 2 points of last month's target keeps it (#4)
  satellite_tax_budget: 0.002        # the satellite's sales may realize this much tax a year, of equity; not while DOWN, capped or halted (#4)
  retry_sessions: 1                  # a rebalance blocked on E is tried once more
  market: SPY                        # the core's funds
  leveraged: SSO
  leverage: 2.0                      # the leveraged fund's daily multiple
  cash: BIL
  satellite_list: [QQQ, IWM, AVUV, MTUM, QUAL, VEA, VWO, GLD, IEF, TLT, DBMF, BIL, SPY]
  tax_rate: 0.25                     # Israel: realized gains (nominal USD, FIFO), dividends and interest
  backtest:
    start_equity: 100000
    score_start_year: 1928           # 1926-07 to 1927 is the warm-up
    market_fee: 0.0009               # SPY's expense ratio, a year
    leveraged_fee: 0.0090            # SSO's
    cash_fee: 0.0014                 # BIL's
    financing_spread: 0.0050         # the 2x fund borrows 1x at the T-bill rate plus this
    market_slippage: 0.0005          # the sim: tiers by each fund's liquidity today
    leveraged_slippage: 0.0010
    cash_slippage: 0.0005
    window_years: 10                 # G3: rolling windows, each an independent run ...
    min_window_share: 0.60           # ... the strategy ahead in at least this share
    near_miss_cagr: 0.01             # a failed gate with G2 held and the after-tax CAGR at most 1 point behind
    bootstrap_block_sessions: 63
    bootstrap_samples: 2000
    confidence: 0.9
    seed: 37
    timing_offsets: [1, 6, 11, 16]   # diagnostic D-c
    c1_sma_sessions: 200             # comparison C1: the 200-session SMA of the daily index on R
    c2_up_level: 1.5                 # comparison C2
    c2_down_level: 0.0
    margin_spread: 0.015             # comparison C3: borrowing at the T-bill rate plus this ...
    margin_maintenance: 0.25         # ... a margin call below 25% equity sells to 1.0x
    # The data checks (pre-registration §4.4) and the blind check's stop conditions (§7):
    check_min_correlation: 0.98      # daily, the proxy and the synthesis against the real funds from 2016
    check_max_cagr_gap: 0.015
    max_session_gap_days: 7
    blind_max_flips_per_year: 4
    blind_max_halt_share: 0.30

llm:  # README §9; see auratrade.llm.client. The model and its effort are settings (PM_MODEL, PM_EFFORT).
  max_tokens: 16000                  # per response, thinking included; non-streaming stays under the SDK's timeout
  max_turns: 6                       # tool rounds in one decision; the last must answer
  request_timeout_seconds: 300       # one attempt; the job's deadline cuts it shorter
  max_retries: 2                     # the SDK's retries of 408/409/429/5xx and connection errors
  fallbacks: true                    # server-side fallbacks on a refusal (fallbacks "default"); the answering model is stored
  cost_alert_usd: 1.00               # one decision (all its turns) above this alerts
  prices:                            # US$ per million tokens; cache writes at the 5-minute rate (1.25x input)
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
    claude-opus-5: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
    claude-opus-4-8: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}

portfolio_manager:  # README §5.4: the facts the Portfolio Manager sees and its tools
  return_sessions: {1m: 21, 3m: 63, 6m: 126, 12m: 252}   # each satellite ETF's returns
  volatility_sessions: 63            # its realized volatility, annualized
  sma_sessions: 200                  # its distance from this moving average
  correlation_sessions: 252          # its daily returns' correlation with SPY's
  headlines: 20                      # the most recent headlines in the facts
  news_items: 10                     # one get_news call
  history_months: 24                 # get_decision_history's most
  history_sessions: 300              # the funds' bars before the trial's start: SMA10's months, the ETFs' 12-month facts
  dry_run_equity: 100000             # the simulated book's and the twin's start (#31); the paper account's too
  deadline: "12:00"                  # ET on E: no valid decision by then holds (#6)
  headline_sessions: 5               # the headlines in the facts: from this many sessions back
  scorecard:                         # README §5.5: each decision scored against the twin
    flat_band: 0.01                  # an expectation within ±1 point says "level with SPY"; right if the outcome is too
    size_factor: 2.0                 # the size is right when the outcome is within 2x of the expectation, either way
    bootstrap_months: 24             # the headline's interval from this many complete months
    block_months: 3                  # resampled in blocks of months
    samples: 10000
    confidence: 0.90
    seed: 20261027
