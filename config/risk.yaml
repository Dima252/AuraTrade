# Every trading threshold lives here (CLAUDE.md §6), loaded into `auratrade.config.RiskConfig`.
# Unknown keys are rejected. The hash of the validated values is logged with every job run,
# so a change here is visible in every log line that follows it.
#
# Fractions are of equity (0.01 = 1%). Windows count sessions, never calendar days.
# Sections for scans, entry rules, exit-plan menus, early-behaviour rules and the earnings
# cushion are added with the tasks that implement them (3.x).

regimes:  # README §6
  CONFIRMED_UPTREND:
    strategies:
      - {strategy: VCP_BREAKOUT}
      - {strategy: MOMENTUM_BREAKOUT}
      - {strategy: EPISODIC_PIVOT}
      - {strategy: LEADER_PULLBACK}
    base_risk: 0.01
    max_exposure: 1.0
    max_positions: 6
    max_positions_large_account: 8
  UNDER_PRESSURE:
    strategies:
      - {strategy: LEADER_PULLBACK, min_conviction: 4}
      - {strategy: VCP_BREAKOUT, min_conviction: 4}
      - {strategy: EPISODIC_PIVOT, min_conviction: 4}
    base_risk: 0.005
    max_exposure: 0.5
    max_positions: 4
  EARLY_UPTREND:  # starter limits; see early_uptrend_step
    strategies:
      - {strategy: EMERGING_LEADER}
      - {strategy: EPISODIC_PIVOT}
    base_risk: 0.0025
    max_exposure: 0.25
    max_positions: 3
  CORRECTION:  # cash: existing positions only
    strategies: []
    base_risk: 0.0
    max_exposure: 0.0
    max_positions: 0
  early_uptrend_step:  # never applies to a `no_ftd` entry
    starter_sessions: 10
    min_score_to_step_up: 1
    stepped_base_risk: 0.005
    stepped_max_exposure: 0.5
  large_account_equity: 100000

guardrails:  # README §8
  max_risk_per_trade: 0.015          # hard cap on effective risk
  max_position_size: 0.25
  max_heat: 0.06
  heat_min_room_of_planned: 0.5      # clip to the room left; reject below half the planned risk
  max_per_cluster: 2
  cluster_correlation: 0.7
  cluster_correlation_sessions: 60
  pivot_tolerance: 0.03              # LLM pivot within ±3% of the code pivot
  min_stop_below_pivot_atr: 0.5
  max_chase_above_pivot: 0.05
  max_above_50d: 0.25                # momentum and EPs exempt
  late_stage_base_count: 3           # risk × late_stage_risk_factor
  late_stage_risk_factor: 0.5
  max_base_count: 3                  # a 4th-stage base or later is not fundable
  earnings_blackout_sessions: 5
  earnings_estimate_sessions: 63     # unknown next date: last report + 63 sessions
  earnings_estimate_window_sessions: 10
  tranche2_max_sessions: 3

halts:  # README §8, §5.13
  daily_loss: 0.02
  weekly_loss: 0.05
  drawdown: 0.15

multiplier:  # README §8, progressive exposure
  win_r: 0.5
  loss_r: 0.5
  deep_drawdown: 0.10
  deep_drawdown_multiplier: 0.25
  drawdown: 0.05
  drawdown_multiplier: 0.5
  tier_exit_wins: 3
  losing_streak: 3
  losing_streak_exit_wins: 2
  losing_streak_multiplier: 0.5
  prove_it_wins: 2
  prove_it_multiplier: 0.5
  unproven_regime_trades: 5
  unproven_regime_multiplier: 0.5
  trading_well_high_sessions: 5
  trading_well_trades: 10
  trading_well_multiplier: 1.25

climax:  # README §7.3 "Climax sale"
  up_day_clusters:                   # >= 7 up days in 8, or >= 8 in 10
    - {up_days: 7, of_sessions: 8}
    - {up_days: 8, of_sessions: 10}
  min_above_long_average: 0.70       # >= 70% above the 200-day
  fast_gain_min: 0.25                # >= 25% gain ...
  fast_gain_window: 15               # ... in <= 15 sessions ...
  # ... "after an extended run": only once the move is this many sessions old. Provisional:
  # the first 15 sessions after the breakout are the 8-week-hold window (+20% in 15), where
  # a fast gain is a strength signal, not a climax. Tuned only on backtest evidence (3.8).
  fast_gain_min_move_sessions: 15
  # The exhaustion-gap minimum has no README value yet; it is added with the plan engine (3.5a).
  sell_half_signals: 2
  sell_all_signals: 3

data:  # README §4
  min_coverage: 0.90
  macro_stale_sessions: 2

jobs:  # README §2
  chain_wait_minutes: 30
  duration_alert_minutes: 10
  stale_running_minutes: 20

trend_template:  # README §5.3 (Minervini)
  short_sma: 50
  mid_sma: 150
  long_sma: 200
  long_sma_rising_sessions: 22       # rule 3: the 200 SMA above its value 22 sessions ago
  range_sessions: 252                # the 52-week high and low
  min_above_low: 0.30                # rule 6: >= 30% above the 52-week low
  max_below_high: 0.25               # rule 7: within 25% of the 52-week high
  min_rs_rating: 70                  # rule 8
  rs_weights:                        # RS score = 0.4*R63 + 0.2*R126 + 0.2*R189 + 0.2*R252
    - {lookback: 63, weight: 0.4}
    - {lookback: 126, weight: 0.2}
    - {lookback: 189, weight: 0.2}
    - {lookback: 252, weight: 0.2}
  required_rules:                    # rule numbers each strategy needs; EPs are exempt
    VCP_BREAKOUT: [1, 2, 3, 4, 5, 6, 7, 8]
    MOMENTUM_BREAKOUT: [1, 2, 3, 4, 5, 6, 7, 8]
    LEADER_PULLBACK: [1, 2, 3, 4, 5, 6, 7, 8]
    EMERGING_LEADER: [1, 5, 6, 7, 8]   # the MA stack (2-4) lags right after a correction
    EPISODIC_PIVOT: []

bases:  # README §5.3 base count (IBD); see indicators/bases.py
  min_sessions: 25                   # IBD's 5-week minimum; shorter consolidations are ignored
  max_depth: 0.50                    # deeper is not a base, and resets the count
  swing_reversal: 0.03               # a contraction is a >= 3% pullback from a swing high
  pivot_min_position: 0.5            # the final contraction's high is the pivot only in the upper half
  new_stage_advance: 0.20            # a new stage needs >= 20% from the prior base's pivot

regime:  # README §5.2; provisional until the 2.4 regime backtest (final after the 3.8 re-run)
  indexes: [SPY, QQQ]                # both for +1, either for -1; distribution counted per index
  index_trend:
    short_sma: 50
    long_sma: 200
    slope_sessions: 10               # "50 SMA rising / falling": vs its value 10 sessions ago
  breadth:
    sma: 50
    up_min_above: 0.60               # +1: > 60% above the 50 SMA and net new highs > 0
    down_max_above: 0.35             # -1: < 35% above, or net new highs < 0
    new_high_sessions: 252           # 52-week highs and lows
    net_new_highs_sessions: 10       # averaged over 10 sessions
    # Universe filters (README §5.1), applied inline until task 1.5 builds the universe table.
    universe_security_types: [COMMON, ADR]
    universe_min_price: 10.0         # raw close as it traded that day
    universe_min_dollar_volume: 10000000
    universe_dollar_volume_sessions: 50
    universe_min_history_sessions: 252
  volatility:
    up_max_vix: 20                   # +1: VIX < 20 and VIX/VIX3M < 0.9
    up_max_ratio: 0.9
    down_min_ratio: 1.0              # -1: VIX/VIX3M > 1.0 or VIX > 30
    down_min_vix: 30
  distribution:
    min_decline: 0.002               # down >= 0.2% on volume above the prior session's
    window_sessions: 25
    up_max_days: 3                   # +1: <= 3 (higher index count)
    down_min_days: 6                 # -1: >= 6
    exclude_expiration_sessions: false   # flagged either way; the 2.4 backtest compares
  leadership:
    result_sessions: 5               # a breakout's result is complete 5 sessions after it
    window_sessions: 20              # breakouts from T-24 to T-5
    min_breakouts: 10                # fewer scores 0
    up_min_share: 0.55
    down_max_share: 0.35
  follow_through:
    min_gain: 0.0125
    first_day: 4
    last_strong_day: 7               # later FTDs are flagged weaker
  transitions:
    confirmed_min_score: 3           # +3..+5 CONFIRMED_UPTREND
    correction_max_score: -1         # <= -1 CORRECTION (immediate from CU / UP)
    debounce_score: 2                # CU -> UP at +2 only after debounce_sessions in a row
    debounce_sessions: 2
    upgrade_sessions: 3              # UP / EU -> CU after 3 sessions >= +3 in the state
    early_uptrend_min_sessions: 10   # labels in EARLY_UPTREND before CONFIRMED_UPTREND
    no_ftd_sessions: 10              # CORRECTION -> EARLY_UPTREND (no_ftd) after 10 sessions >= +3
    no_ftd_min_score: 3
    early_uptrend_max_distribution: 6    # since entering EARLY_UPTREND, higher index count
  crisis:  # no new entries (README §5.2)
    vix_ratio_above: 1.0             # VIX/VIX3M > 1.0 ...
    vix_ratio_sessions: 2            # ... for >= 2 sessions
    index: SPY
    index_drop: 0.04                 # SPY -4% in a session: that session and the next
  replay_warmup_sessions: 252        # a replay starts this many sessions before its first label
