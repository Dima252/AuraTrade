[project]
name = "auratrade"
version = "0.1.0"
description = "Autonomous swing-trading system for US stocks: an LLM decides inside hard risk limits enforced by code."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "alpaca-py>=0.44.0",
    "anthropic>=1.12.1",
    "boto3>=1.43.110",
    "httpx>=0.28.1",
    "pandas-market-calendars>=5.5.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
auratrade = "auratrade.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[lambda,s3,scheduler,ssm]>=1.43.110",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
# Research-only dependencies for backtest/ (filled in by Phases 2-3).
backtest = []
infra = [
    "aws-cdk-lib>=2.272.0",
    "constructs>=10.8.1",
]
spikes = [
    "mplfinance>=0.12.10b0",
    # Imported directly by spikes/edge_check (otherwise only a transitive pandas dependency).
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    # pandas-market-calendars is a main dependency (calendar cross-check).
    "pyarrow>=25.0.1",
]

[tool.uv]
# infra is a default group so CI synthesizes and tests the CDK stacks.
default-groups = ["dev", "infra"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]
# Honour the excludes when pre-commit passes file names explicitly.
force-exclude = true

[tool.ruff.format]
# Code blocks in the README/docs are illustrative spec text, not formatted code.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "DTZ",     # naive datetimes are banned (CLAUDE.md §6: timezone-aware only)
    "PT",      # pytest style
    "N",       # naming
    "S",       # bandit
    "C4",      # comprehensions
    "PTH",     # pathlib
    "T20",     # no print() in library code
]

[tool.ruff.lint.isort]
# The repo's alembic/ folder (migrations) would otherwise make the library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Fake tokens in tests are fixtures, not credentials.
"tests/**" = ["S101", "S105", "S106"]
"spikes/**" = ["T20", "S101"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "scripts", "infra"]
# cdk synth stages a copy of src/ there for the image.
exclude = ['infra/cdk.out/']

[[tool.mypy.overrides]]
# No type information shipped; only sources.exchange_calendar_sessions touches it.
module = ["pandas_market_calendars"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No type information shipped; used only to write and read Parquet archives.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for scripts/; "infra" because CDK stacks live outside src/ (README §13) and are imported as `stacks.*`.
pythonpath = [".", "infra"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = [
    "error",
    # alpaca-py still imports websockets.legacy (third-party; not our code).
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["auratrade"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
